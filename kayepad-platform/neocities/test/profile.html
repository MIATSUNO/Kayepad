<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil — Kaystant</title><link rel="stylesheet" href="style.css"></head><body class="profile-shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>kaystant</span></a><nav><a href="index.html#descobrir">Descobrir</a><a href="studio.html">Criar</a><a href="index.html#loja">Loja</a></nav><a class="btn ghost" href="index.html">Voltar</a></header><main class="profile-page shell"><section class="profile-hero"><div class="profile-banner" id="banner"></div><div class="profile-head"><div class="profile-avatar" id="initial">K</div><div><p class="eyebrow">perfil de autor</p><h1 id="profile-name">Carregando...</h1><p class="profile-bio" id="bio"></p><div class="profile-tags"><span id="followers">0 seguidores</span><span id="following">0 seguindo</span></div></div><button class="btn primary" id="edit" hidden>Editar perfil</button></div></section><section class="profile-layout"><div><div class="section-heading"><div><p class="eyebrow">publicações</p><h2>A tinta que deixou</h2></div></div><div id="posts"><p class="empty-state">Ainda não há publicações neste perfil.</p></div></div><aside><div class="panel"><div class="panel-title"><span>Sobre este autor</span></div><p class="muted" id="links">Nenhum link adicionado.</p><button class="btn primary" id="follow">Seguir</button></div></aside></section></main><dialog id="editor"><form method="dialog" class="modal-card wide" id="profile-form"><button class="close">×</button><p class="eyebrow">seu perfil</p><h2>Editar perfil</h2><label>Nome de exibição<input id="edit-display" maxlength="80"></label><label>Nome de usuário<input id="edit-username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+"></label><label>Bio<textarea id="edit-bio" maxlength="280"></textarea></label><label>Links públicos <small>um link por linha</small><textarea id="edit-links" rows="3" placeholder="https://seusite.com"></textarea></label><label>Cor da sua tinta<input id="ink-color" type="color" value="#5367d8"></label><div class="modal-actions"><button class="btn ghost" value="cancel">Cancelar</button><button class="btn primary" id="save" value="save">Salvar alterações</button></div></form></dialog><div class="toast" id="toast"></div><script src="config.js"></script><script>(async()=>{const API=window.KAYSTANT_API||'',token=localStorage.getItem('kaystant_token')||'',q=new URLSearchParams(location.search),name=q.get('user')||'morveyn',$=s=>document.querySelector(s),toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)},esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;try{const r=await fetch(`${API}/users/${encodeURIComponent(name)}`);if(!r.ok)throw Error();data=await r.json()}catch(e){$('#profile-name').textContent='Perfil não encontrado';return}const p=data.profile;$('#profile-name').textContent=p.show_display_name&&p.display_name?`${p.display_name} · @${p.username}`:`@${p.username}`;$('#bio').textContent=p.bio||'Este autor ainda está escrevendo sua apresentação.';$('#initial').textContent=(p.username||'K')[0].toUpperCase();$('#initial').style.background=p.ink_color||'#5367d8';$('#followers').textContent=`${data.followers} seguidores`;$('#following').textContent=`${data.following} seguindo`;if(p.banner_url)$('#banner').style.backgroundImage=`url(${p.banner_url})`;if(p.links?.length)$('#links').innerHTML=p.links.map(x=>`<a href="${esc(x)}" target="_blank" rel="noopener">${esc(x)}</a>`).join('<br>');if(name===p.username)$('#follow').remove();let current=null;if(token){try{const r=await fetch(API+'/me',{headers:{Authorization:`Bearer ${token}`}});if(r.ok)current=await r.json()}catch(e){}}if(current&&current.id===p.id){$('#edit').hidden=false;$('#edit').onclick=()=>{$('#edit-display').value=p.display_name||'';$('#edit-username').value=p.username||'';$('#edit-bio').value=p.bio||'';$('#edit-links').value=(p.links||[]).join('\n');$('#ink-color').value=p.ink_color||'#5367d8';$('#editor').showModal()}}else $('#edit').remove();if(token&&current&&current.id!==p.id)$('#follow').onclick=async()=>{const r=await fetch(`${API}/users/${encodeURIComponent(p.username)}/follow`,{method:'POST',headers:{Authorization:`Bearer ${token}`}});if(r.ok){const d=await r.json();$('#follow').textContent=d.following?'Seguindo':'Seguir';$('#followers').textContent=`${d.followers} seguidores`;toast(d.following?'Você está seguindo este autor ✦':'Você deixou de seguir este autor')}};$('#save').onclick=async e=>{e.preventDefault();const links=$('#edit-links').value.split(/\n/).map(x=>x.trim()).filter(Boolean);const r=await fetch(`${API}/profile`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({display_name:$('#edit-display').value.trim(),username:$('#edit-username').value.trim(),bio:$('#edit-bio').value,links,ink_color:$('#ink-color').value})});if(r.ok){toast('Perfil salvo ✦');setTimeout(()=>location.reload(),450)}else{const d=await r.json().catch(()=>({}));toast(d.detail||'Não foi possível salvar agora.')}};if(data.posts?.length)$('#posts').innerHTML=data.posts.map(x=>`<article class="profile-post"><i class="post-color" style="background:${esc(p.ink_color||'#5367d8')}"></i><div><small>${esc(x.category)}</small><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small>${x.ink_total||0} tintas recebidas</small></div><b>${Math.min(100,Math.round((x.ink_total||0)/(x.ink_goal||100)*100))}%</b></article>`).join('')})()</script></body></html>
